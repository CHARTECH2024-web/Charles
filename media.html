<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HORIZON</title>
<link rel="icon" type="image/svg+xml" href="./horizon-icon.svg?v=2">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="animations.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div id="site-header"></div>
<main>
  <h2>Media Center</h2>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">Tout</button>
    <button class="filter-btn" data-filter="photo">Photos</button>
    <button class="filter-btn" data-filter="video">Vidéos</button>
  </div>
  <div class="grid" id="mediaContainer">
    <p class="skeleton">Chargement des médias...</p>
  </div>
  <p id="mediaEmpty" class="skeleton" style="display:none;">Aucun média public disponible pour le moment.</p>
</main>
<div id="site-footer"></div>
<div id="chatbot-root"></div>
<script type="module" src="firebase-config.js"></script>
<script type="module" src="main.js"></script>
<script type="module">
  import { loadPublicMedia } from './media.js';
  window.loadPublicMedia = loadPublicMedia;
  window.addEventListener('DOMContentLoaded', () => loadPublicMedia('all'));
</script>
</body>
</html>
