<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charles | Electrical Engineering & Technology Portfolio</title>
  <meta name="description" content="Portfolio of Charles, an electrical engineering student and technology enthusiast focused on engineering, electronics, and hardware innovation.">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="BISIMWA MUSHIMANJA CHARLES - Electrical Engineering Portfolio">
  <meta property="og:description" content="Building ideas where electricity, code, engineering, and innovation meet.">

  <style>
    /* ==========================================================================
       1. VARIABLES & RESET
       ========================================================================== */
    :root {
      --bg-black: #050505;
      --bg-dark: #0a0a0a;
      --bg-steel: rgba(28, 28, 28, 0.6);
      --steel-border: rgba(60, 60, 60, 0.5);
      --text-muted: #999999;
      --text-main: #F5F5F5;
      --orange: #FF6A00;
      --orange-hot: #FF8A00;
      --orange-glow: rgba(255, 106, 0, 0.15);
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Courier New', Courier, monospace;
      --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      background-color: var(--bg-black);
      /* Engineering Grid Background */
      background-image: 
        radial-gradient(var(--steel-border) 1px, transparent 1px),
        radial-gradient(var(--steel-border) 1px, transparent 1px);
      background-position: 0 0, 20px 20px;
      background-size: 40px 40px;
      color: var(--text-main);
      font-family: var(--font-main);
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glow behind the whole site */
    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 106, 0, 0.03), transparent 60%);
      pointer-events: none;
      z-index: -1;
    }

    /* Custom Cursor */
    @media (pointer: fine) {
      body { cursor: default; }
      .cursor-dot {
        width: 6px; height: 6px;
        background: var(--orange-hot);
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 12px var(--orange-hot);
      }
      .cursor-outline {
        width: 40px; height: 40px;
        border: 1px solid rgba(255, 106, 0, 0.5);
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9998;
        transform: translate(-50%, -50%);
        transition: width 0.15s, height 0.15s, background-color 0.15s;
      }
    }

    ::selection {
      background-color: var(--orange);
      color: #000;
    }

    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    /* Language Switch Button */
    .lang-toggle {
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(5px);
      border: 1px solid var(--orange);
      color: var(--orange-hot);
      padding: 6px 12px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 4px;
      transition: var(--transition);
      margin-left: 15px;
      box-shadow: 0 0 10px rgba(255, 106, 0, 0.1);
    }
    .lang-toggle:hover {
      background: var(--orange);
      color: var(--bg-black);
      box-shadow: 0 0 20px rgba(255, 106, 0, 0.4);
    }

    /* ==========================================================================
       2. TYPOGRAPHY & UI COMPONENTS
       ========================================================================== */
    .section-title {
      font-size: 2.5rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 20px;
      text-shadow: 0 0 20px rgba(255, 106, 0, 0.2);
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--orange), transparent);
      box-shadow: 0 0 10px var(--orange);
    }

    .section-subtitle {
      color: var(--orange);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      text-transform: uppercase;
      margin-bottom: 3.5rem;
      display: block;
      letter-spacing: 1px;
    }

    /* Button Styles */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 32px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      border: 1px solid var(--steel-border);
      background: rgba(15, 15, 15, 0.8);
      backdrop-filter: blur(5px);
      color: var(--text-main);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: var(--transition);
      border-radius: 4px;
      z-index: 1;
    }

    .btn::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 0%;
      background: var(--orange);
      transition: var(--transition);
      z-index: -1;
    }

    .btn:hover::after { height: 100%; }
    .btn:hover { color: var(--bg-black); border-color: var(--orange); }

    .btn-primary {
      border-color: var(--orange);
      color: var(--orange);
      box-shadow: 0 0 15px rgba(255, 106, 0, 0.2);
    }
    
    .btn-linkedin {
      border-color: #0077b5;
      color: #0077b5;
    }
    .btn-linkedin::after { background: #0077b5; }
    .btn-linkedin:hover { color: #FFF; box-shadow: 0 0 15px rgba(0, 119, 181, 0.4); border-color: #0077b5; }

    .badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 4px 10px;
      background: rgba(255, 106, 0, 0.1);
      border: 1px solid var(--orange);
      color: var(--orange-hot);
      border-radius: 2px;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #00FF66;
      background: rgba(0, 255, 102, 0.05);
      padding: 5px 15px;
      border: 1px solid rgba(0, 255, 102, 0.2);
      border-radius: 20px;
    }
    .status-dot {
      width: 8px; height: 8px;
      background-color: #00FF66;
      border-radius: 50%;
      box-shadow: 0 0 10px #00FF66;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Container */
    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 15px;
    }

    section {
      padding: 120px 0;
      position: relative;
    }

    /* Premium Glass Card Style */
    .glass-card {
      background: rgba(15, 15, 15, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--steel-border);
      border-radius: 6px;
      transition: var(--transition);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .glass-card:hover {
      border-color: rgba(255, 106, 0, 0.5);
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(255, 106, 0, 0.1);
    }

    /* ==========================================================================
       3. NAVIGATION
       ========================================================================== */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: rgba(5, 5, 5, 0.85);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255, 106, 0, 0.2);
      transition: var(--transition);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 80px;
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 5px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }
    .logo span { color: var(--orange); text-shadow: 0 0 15px var(--orange); }

    .nav-links {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    .nav-links a {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: var(--transition);
      position: relative;
      letter-spacing: 1px;
    }

    .nav-links a:hover { color: var(--orange-hot); }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -6px; left: 0;
      width: 0; height: 2px;
      background: var(--orange);
      transition: var(--transition);
      box-shadow: 0 0 8px var(--orange);
    }
    .nav-links a:hover::after { width: 100%; }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      background: none;
      border: none;
    }
    .hamburger span {
      width: 30px; height: 2px;
      background-color: var(--orange);
      transition: var(--transition);
    }

    /* ==========================================================================
       4. HERO SECTION
       ========================================================================== */
    #hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 80px;
      position: relative;
    }

    #forge-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .hero-wrapper {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 50px;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .hero-meta { margin-bottom: 20px; }

    .hero-name {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.1;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #FFF 0%, #AAA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .hero-title {
      font-family: var(--font-mono);
      color: var(--orange);
      font-size: 1.3rem;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 106, 0, 0.3);
    }

    .hero-tagline {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 40px;
      max-width: 580px;
      border-left: 3px solid var(--orange);
      padding-left: 20px;
      line-height: 1.8;
      background: linear-gradient(90deg, rgba(255, 106, 0, 0.05), transparent);
    }

    .hero-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* Graphic Tech Core */
    .hero-visual {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tech-core {
      width: 100%; max-width: 450px; aspect-ratio: 1;
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid var(--steel-border);
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        inset 0 0 40px rgba(0,0,0,0.9),
        0 0 30px rgba(255, 106, 0, 0.1);
    }

    .tech-ring {
      position: absolute;
      width: 85%; height: 85%;
      border: 1px dashed rgba(255, 106, 0, 0.4);
      border-radius: 50%;
      animation: spin 30s linear infinite;
    }

    .tech-ring-inner {
      position: absolute;
      width: 65%; height: 65%;
      border: 2px solid rgba(255, 106, 0, 0.1);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin-reverse 20s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }

    .engineer-svg {
      width: 50%; height: 50%;
      filter: drop-shadow(0 0 15px rgba(255, 106, 0, 0.5));
      z-index: 2;
    }

    /* ==========================================================================
       5. ABOUT SECTION
       ========================================================================== */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
    }

    .about-text p {
      margin-bottom: 25px;
      color: #DDD;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    .about-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .about-card {
      padding: 25px;
    }

    .about-card h4 {
      font-family: var(--font-mono);
      color: var(--orange-hot);
      margin-bottom: 10px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .about-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* ==========================================================================
       6. ENGINEERING MINDSET
       ========================================================================== */
    .mindset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
    }

    .mindset-card {
      padding: 40px 25px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .mindset-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--orange), transparent);
      opacity: 0;
      transition: var(--transition);
    }

    .mindset-card:hover::before { opacity: 1; }

    .mindset-num {
      font-family: var(--font-mono);
      font-size: 1rem;
      color: rgba(255, 106, 0, 0.3);
      position: absolute;
      top: 20px; right: 20px;
      font-weight: bold;
    }

    .mindset-card h3 {
      font-size: 1.4rem;
      letter-spacing: 2px;
      margin-bottom: 15px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .mindset-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* ==========================================================================
       7. TECHNICAL SKILLS
       ========================================================================== */
    .skills-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }

    .skill-category {
      padding: 30px;
    }

    .skill-category h3 {
      font-family: var(--font-mono);
      color: var(--orange-hot);
      font-size: 1.15rem;
      margin-bottom: 25px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 106, 0, 0.3);
      text-transform: uppercase;
    }

    .skill-item { margin-bottom: 20px; }

    .skill-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .skill-name { font-weight: 600; letter-spacing: 0.5px; }

    .skill-level {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--orange);
      text-transform: uppercase;
      background: rgba(255, 106, 0, 0.1);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .skill-bar-ascii {
      font-family: var(--font-mono);
      letter-spacing: 3px;
      color: var(--steel-border);
      font-size: 0.9rem;
    }

    .skill-bar-ascii .fill {
      color: var(--orange);
      text-shadow: 0 0 5px var(--orange);
    }

    /* ==========================================================================
       8. FEATURED PROJECT
       ========================================================================== */
    .featured-project {
      padding: 45px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 106, 0, 0.4);
      box-shadow: 0 0 40px rgba(255, 106, 0, 0.05), inset 0 0 20px rgba(0,0,0,0.8);
      background: linear-gradient(180deg, rgba(15,15,15,0.8) 0%, rgba(5,5,5,0.9) 100%);
      backdrop-filter: blur(15px);
    }

    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 25px;
    }

    .project-title-area h3 {
      font-size: 2.2rem;
      color: var(--text-main);
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
      letter-spacing: 1px;
      margin-top: 10px;
    }

    .project-tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .project-desc {
      color: #CCC;
      font-size: 1.05rem;
      margin-bottom: 35px;
      max-width: 900px;
      line-height: 1.8;
    }

    /* System Schematic */
    .ecochar-diagram {
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed rgba(255, 106, 0, 0.3);
      padding: 30px 20px;
      border-radius: 6px;
      margin-top: 25px;
    }

    .diagram-title {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--orange);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .diagram-flow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 15px;
    }

    .flow-step {
      background: rgba(20, 20, 20, 0.8);
      border: 1px solid var(--steel-border);
      padding: 18px 15px;
      min-width: 130px;
      text-align: center;
      border-radius: 4px;
      flex-shrink: 0;
      position: relative;
      transition: var(--transition);
    }

    .flow-step.highlight {
      border-color: var(--orange);
      background: rgba(255, 106, 0, 0.1);
      box-shadow: 0 0 15px rgba(255, 106, 0, 0.15);
    }

    .step-num {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
    }
    .highlight .step-num { color: var(--orange); }

    .step-name {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .flow-arrow {
      color: rgba(255, 106, 0, 0.5);
      font-family: var(--font-mono);
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .machine-visual {
      width: 100%;
      height: 250px;
      margin-top: 35px;
      background: rgba(5, 5, 5, 0.8);
      border: 1px solid rgba(255, 106, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    /* ==========================================================================
       9. INTERESTS & EDUCATION
       ========================================================================== */
    .interests-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 25px;
    }

    .interest-card {
      padding: 30px 20px;
      text-align: center;
    }

    .interest-icon {
      font-size: 2.5rem;
      margin-bottom: 15px;
      display: block;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
    }
