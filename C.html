<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio de Charles">
  <title>Charles — Portfolio</title>
  <style>
    :root { color-scheme: dark; --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; font-family: system-ui, sans-serif; color: var(--text); background: linear-gradient(135deg, #020617, var(--bg)); }
    main { width: min(720px, 100%); padding: 3rem; text-align: center; background: var(--card); border: 1px solid #334155; border-radius: 1.25rem; box-shadow: 0 1.5rem 4rem #02061799; }
    h1 { margin: 0 0 1rem; font-size: clamp(2.5rem, 8vw, 5rem); }
    p { color: var(--muted); font-size: 1.15rem; line-height: 1.7; }
    a { display: inline-block; margin-top: 1rem; padding: .8rem 1.2rem; color: #082f49; background: var(--accent); border-radius: .6rem; font-weight: 700; text-decoration: none; }
    a:hover, a:focus-visible { background: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <h1>Charles</h1>
    <p>Bienvenue sur mon portfolio. Cette page est publiée avec GitHub Pages.</p>
    <a href="mailto:charlestechnology46@gmail.com">Me contacter</a>
  </main>
</body>
</html>
