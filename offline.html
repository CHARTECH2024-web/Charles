<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4c400">
  <title>NURU — Hors connexion</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#09090f;color:#f7f7f7;font:16px/1.6 system-ui,sans-serif}
    main{width:min(100%,440px);text-align:center;border:1px solid #33333b;border-radius:24px;padding:32px 24px;background:#111118}
    .mark{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:18px;background:#f4c400;color:#09090f;font-weight:900;font-size:38px}
    h1{margin:20px 0 8px;font-size:28px}p{color:#c7c7d0}
    button{border:0;border-radius:999px;padding:13px 22px;background:#f4c400;color:#09090f;font-weight:800;font-size:15px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">N</span>
    <h1>Vous êtes hors connexion</h1>
    <p>NURU a besoin d'une connexion Internet pour charger les pages et synchroniser les comptes, messages et données commerciales.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
